<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Email Repository{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <h1><a href="{{ url_for('index') }}">Email Repository</a></h1>
      <nav>
        <a href="{{ url_for('inbox') }}">Inbox</a>
        <a href="{{ url_for('sent') }}">Sent</a>
        <a class="cta" href="{{ url_for('compose') }}">Compose</a>
      </nav>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
